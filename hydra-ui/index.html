<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Hydra</title>
    <link rel="icon" href="hydra-icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="hydra-icon.png" />
    <link rel="preload" href="hydra-icon.png" as="image" fetchpriority="high" />
    <style>
      html, body { margin: 0; background: #dce7f2; }
      .boot-splash { position: fixed; inset: 0; z-index: 10000; display: grid; place-items: center; background: #dce7f2; }
      .boot-splash img { width: 112px; height: 112px; border-radius: 25%; }
    </style>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="boot-splash" class="boot-splash" role="status" aria-label="Opening Hydra">
      <img src="hydra-icon.png" alt="" />
    </div>
    <a class="skip-link" href="#main">Skip to discussion</a>
    <div id="app" class="app-shell" aria-busy="true" hidden>
      <header class="topbar">
        <label class="search-box">
          <span class="sr-only">Search Hydra</span>
          <input id="global-search" type="search" placeholder="Search people, /h/ communities, or Reddit URLs" autocomplete="off" />
          <kbd>⌘K</kbd>
        </label>
        <div class="topbar-drag-region" aria-hidden="true" data-tauri-drag-region></div>
        <div class="top-actions">
          <button id="messages-button" class="toolbar-icon-button message-button" type="button" data-nav="messages" aria-label="Messages" title="Messages">
            <svg class="toolbar-icon-glyph message-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M2.25 5h19.5v14H2.25zM3 5.8l9 6.7 9-6.7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
            </svg>
            <span id="message-badge" class="message-count" hidden></span>
          </button>
          <button id="settings-button" class="toolbar-icon-button settings-button" type="button" data-nav="settings" aria-label="Settings" title="Settings (⌘,)">
            <svg class="toolbar-icon-glyph settings-icon" viewBox="0 0 14 14" aria-hidden="true" focusable="false">
              <path d="M14 8.3V5.73l-1.58-.264c-.117-.44-.292-.848-.496-1.2l.93-1.285-1.81-1.84-1.31.908c-.371-.205-.781-.38-1.187-.497L8.288 0H5.72l-.263 1.578c-.437.117-.816.293-1.196.497L2.979 1.17 1.141 2.98l.934 1.287c-.2.38-.376.79-.493 1.228L.004 5.73V8.3l1.575.264c.117.438.292.818.496 1.198l-.93 1.315 1.809 1.813 1.312-.938c.38.205.787.38 1.224.497l.26 1.55h2.566l.263-1.58c.408-.117.817-.293 1.196-.497l1.315.935 1.81-1.812-.935-1.315c.203-.38.38-.76.495-1.2L14 8.305zM7 9.704c-1.488 0-2.683-1.2-2.683-2.69S5.542 4.327 7 4.327s2.683 1.198 2.683 2.69c0 1.49-1.195 2.688-2.683 2.688z" fill="currentColor" />
            </svg>
          </button>
          <button id="persona-button" class="persona-button" type="button" aria-haspopup="menu" aria-expanded="false">
            <span class="avatar" aria-hidden="true">?</span>
            <span class="persona-copy"><strong>No persona</strong><small>Create one to participate</small></span>
          </button>
        </div>
      </header>

      <aside class="sidebar" aria-label="Hydra navigation">
        <nav>
          <button class="nav-item is-active" type="button" data-nav="feed"><span>⌂</span>My Feed</button>
          <button class="nav-item" type="button" data-nav="front"><span>✦</span>Front Page</button>
          <button class="nav-item" type="button" data-nav="open-nostr"><span>◎</span>Open Nostr</button>
          <button class="nav-item" type="button" data-nav="revisited" title="Posts saved privately for this persona">
            <span><svg class="nav-icon" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path d="M5 2.5h8v13l-4-2.7-4 2.7z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" /></svg></span>
            Saved
          </button>
        </nav>
        <section class="community-nav" aria-labelledby="community-heading">
          <div class="section-heading-row">
            <p id="community-heading" class="nav-heading">Communities</p>
            <button id="add-community" class="icon-button" type="button" title="Open a community" aria-label="Open a community">＋</button>
          </div>
          <div id="community-list"></div>
        </section>
      </aside>

      <div
        id="sidebar-resizer"
        class="sidebar-resizer"
        role="separator"
        aria-label="Resize navigation sidebar"
        aria-orientation="vertical"
        aria-valuemin="180"
        aria-valuemax="420"
        aria-valuenow="230"
        tabindex="0"
        title="Drag to resize; double-click to reset"
      ></div>

      <main id="main" class="main-panel" tabindex="-1">
        <section id="view" aria-live="polite"></section>
      </main>

      <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>
      <div id="modal-root"></div>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
