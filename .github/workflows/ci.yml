name: Hydra 1.0

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust contracts and protocol
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch the pinned Theurgy contract validator
        env:
          THEURGY_REV: 5b92846e118c486401e61c21984322a4c19c9e10
        run: >-
          git clone --filter=blob:none https://github.com/andersaamodt/theurgy.git
          "$RUNNER_TEMP/theurgy" &&
          git -C "$RUNNER_TEMP/theurgy" checkout "$THEURGY_REV"
      - name: Install test dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          jq nodejs npm libwebkit2gtk-4.1-dev libssl-dev
          libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: ./.tests/run
        env:
          THEURGY_ROOT: ${{ runner.temp }}/theurgy

  macos:
    name: Tauri macOS package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: tools/package/build-macos-app

  linux:
    name: Tauri Linux ARM64 package
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          nodejs npm libwebkit2gtk-4.1-dev libssl-dev
          libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: tools/package/build-linux-deb

  windows:
    name: Tauri Windows package
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run prepare:sidecar:release
      - run: npx tauri build --bundles nsis
